# Render Blueprint. In Render choose New > Blueprint and select this GitHub repository.
# The database is a file, so it needs a persistent disk. Disks are not available on Render's free plan;
# on the free plan the site works but all accounts and questions are wiped on every restart or redeploy.
services:
  - type: web
    name: edusnap
    runtime: node
    plan: starter
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
    disk:
      name: edusnap-data
      mountPath: /var/data
      sizeGB: 1
